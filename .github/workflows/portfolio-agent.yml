name: portfolio-risk-agent
on:
  push:
    paths:
      - 'projects/portfolio-risk-agent/**'
      - '.github/workflows/portfolio-agent.yml'
  pull_request:
    paths:
      - 'projects/portfolio-risk-agent/**'
      - '.github/workflows/portfolio-agent.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/portfolio-risk-agent
    steps:
      - uses: actions/checkout@v7
      - name: Native release build and tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Address and undefined-behaviour sanitizers
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DQFA_SANITIZERS=ON
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure

  evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/portfolio-risk-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Python environment and base R
        run: |
          python -m pip install -r requirements-lock.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core
      - name: Build native engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Test numerical and orchestration boundaries
        run: |
          python -m pytest -q
          python -m ruff check python tests evaluation data/generate_synthetic.py
      - name: Generate independent numerical evidence
        run: |
          python evaluation/evaluate.py --engine build/qfa_engine --output-dir runs/evaluation
          Rscript evaluation/check_reference.R --prices data/synthetic_prices.csv --output-dir runs/evaluation
      - name: Generate report without API calls
        run: python agent.py --mode demo --output-dir runs/demo
      - uses: actions/upload-artifact@v7
        with:
          name: portfolio-risk-evidence
          path: projects/portfolio-risk-agent/runs/
