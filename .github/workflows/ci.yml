name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Regenerate reports
        run: python scripts/run_analysis.py
      - name: Secret string smoke test
        run: |
          ! grep -R -n -E 'olp_|gho_|git.overleaf.com' --exclude-dir=.git .

  cpp-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile C++ Monte Carlo pricer
        run: |
          c++ -std=c++17 -O3 cpp/monte_carlo_option.cpp -o /tmp/monte_carlo_option
          /tmp/monte_carlo_option
      - name: Run JavaScript option pricer
        run: node javascript/option_pricer.js
