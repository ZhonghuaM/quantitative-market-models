name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -r requirements-lock.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Regenerate reports
        run: python scripts/run_analysis.py --study all
      - name: Secret string smoke test
        run: python scripts/secret_smoke_test.py

  cpp-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Compile C++ Monte Carlo pricer
        run: |
          c++ -std=c++17 -O3 cpp/monte_carlo_option.cpp -o /tmp/monte_carlo_option
          /tmp/monte_carlo_option
      - name: Run JavaScript option pricer
        run: node javascript/option_pricer.js
