[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-portfolio-risk-agent"
version = "0.1.0"
description = "Auditable portfolio-risk tools with a C/C++ numerical core and optional LLM orchestration."
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9", "jsonschema>=4.23", "reportlab>=4.2"]

[project.optional-dependencies]
online = ["openai>=2", "yfinance>=0.2"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
portfolio-risk-agent = "qfa.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
